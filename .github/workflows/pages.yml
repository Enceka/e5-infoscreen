name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build release package and Pages feed
        run: |
          sh tools/make-release.sh
          python3 tools/build-site.py "https://enceka.github.io/infoscreen"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deploy
        uses: actions/deploy-pages@v4
