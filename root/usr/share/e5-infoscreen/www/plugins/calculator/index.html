<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
	/* the info screen's look: dark, large, readable at a glance */
	html, body { margin: 0; height: 100%; background: #0b0e13; color: #e8ecf2;
		font-family: "Noto Sans CJK SC", "DejaVu Sans", sans-serif; user-select: none; cursor: none; }
	body { display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; box-sizing: border-box; }
	#expr { color: #8b95a5; font-size: 18px; text-align: right; min-height: 26px; word-break: break-all; }
	#out { font-size: 44px; font-weight: bold; text-align: right; word-break: break-all; font-variant-numeric: tabular-nums; }
	#help { color: #8b95a5; font-size: 12px; margin-top: 18px; line-height: 1.6; }
	b { color: #4aa3ff; }
</style>
</head>
<body>
<div id="expr"></div>
<div id="out">0</div>
<div id="help"></div>
<script src="/sdk/e5.js"></script>
<script>
'use strict';
// A plugin with no backend: the keypad's digits, * for the operator, confirm
// for "=", back to delete (and, with nothing to delete, to leave).
const OPS = ['+', '−', '×', '÷'];
let acc = null, op = null, cur = '0', fresh = true, opIndex = -1;

const $ = (id) => document.getElementById(id);
function show() {
	$('out').textContent = cur;
	$('expr').textContent = acc == null ? '' : `${fmt(acc)} ${op ?? ''}`;
}
function fmt(n) {
	if (!isFinite(n)) return e5.t({ zh: '错误', en: 'Error' });
	const s = String(+n.toPrecision(12));
	return s.length > 14 ? n.toExponential(8) : s;
}
function apply(a, o, b) {
	return o == '+' ? a + b : o == '−' ? a - b : o == '×' ? a * b : o == '÷' ? a / b : b;
}
function help() {
	$('help').innerHTML = e5.t({
		zh: '<b>0-9</b> 数字 · <b>*</b> 切换运算符 · <b>确认</b> 等于<br><b>左</b> 小数点 · <b>右</b> 清零 · <b>返回</b> 删除 / 退出',
		en: '<b>0-9</b> digits · <b>*</b> operator · <b>confirm</b> equals<br><b>left</b> point · <b>right</b> clear · <b>back</b> delete / leave'
	});
}

e5.onKey((k) => {
	if (k.kind == 'digit' && k.key >= '0' && k.key <= '9') {
		cur = fresh || cur == '0' ? k.key : cur + k.key;
		fresh = false; opIndex = -1;
	} else if (k.key == '*') {
		// repeated * presses cycle the operator for the same number
		if (opIndex < 0) {
			acc = acc == null || op == null ? +cur : apply(acc, op, +cur);
			cur = fmt(acc);
		}
		opIndex = (opIndex + 1) % OPS.length;
		op = OPS[opIndex];
		fresh = true;
	} else if (k.kind == 'ok') {
		if (acc != null && op != null) cur = fmt(apply(acc, op, +cur));
		acc = null; op = null; fresh = true; opIndex = -1;
	} else if (k.kind == 'left') {
		if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.';
	} else if (k.kind == 'right') {
		acc = null; op = null; cur = '0'; fresh = true; opIndex = -1;
	} else {
		return false;
	}
	show();
	return true;
});

e5.onBack(() => {
	if (!fresh && cur.length > 1) { cur = cur.slice(0, -1); show(); return true; }
	if (!fresh && cur != '0') { cur = '0'; show(); return true; }
	if (acc != null) { acc = null; op = null; cur = '0'; fresh = true; show(); return true; }
	return false;                          // nothing left: leave the plugin
});

e5.onLang(help);
help();
show();
</script>
</body>
</html>
