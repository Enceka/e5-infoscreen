<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Chinese text: Noto Sans CJK, which /etc/init.d/e5-infoscreen binds in
     from the Debian root image (/usr/share/fonts/e5-noto); DejaVu Sans, an
     OpenWrt package, for everything else and when that image is not there. -->
<fontconfig>
	<selectfont>
		<rejectfont>
			<glob>/usr/share/fonts/e5-noto/NotoSerif*</glob>
		</rejectfont>
	</selectfont>
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Noto Sans CJK SC</family>
			<family>DejaVu Sans</family>
		</prefer>
	</alias>
</fontconfig>
